<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Assurance Maladie - Consultation et Analyse</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/png">
</head>
<body>
    <header>
        <!-- Section de navigation -->
        <div class="header">
            <nav class="nav-bar">
                <ul>
                    <!-- Lien vers la page d'accueil -->
                    <li><a href="{{ url_for('accueil') }}">Accueil</a></li>
                    <!-- Lien vers la page "A propos" -->
                    <li><a href="{{ url_for('apropos') }}">A propos</a></li>
                </ul>
            </nav>
        </div>
    </header>
    
    <div class="container1">
        <h1>Montants moyens des prescriptions en France</h1>
        <p>Montants nationaux publiés pour l’ensemble des médecins, par poste de prescription.</p>
        <form method="POST" action="{{ url_for('histogramme_prescription') }}">
            <label for="annee">Choisir une année</label>
            <select id="annee" name="annee">
                {% for option in annees %}
                <option value="{{ option }}"{% if option == annee %} selected{% endif %}>{{ option }}</option>
                {% endfor %}
            </select>
            <button type="submit">Afficher le graphique</button>
        </form>

        {% if histogram_image %}
            <img src="{{ histogram_image }}" alt="Montants moyens des prescriptions en France en {{ annee }}">
        {% else %}
            <p>Aucun montant publié pour cette année dans la base chargée.</p>
        {% endif %}
    </div>
    
</body>
</html>
