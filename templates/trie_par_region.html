       <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Table de correspondance entre les IDs SVG et les IDs de la base de données
            const regionMapping = {
                'FRIDF': '11', // Île-de-France
                'FRHDF': '32', // Hauts-de-France
                'FRGES': '44', // Grand Est
                'FRBFC': '27', // Bourgogne-Franche-Comté
                'FRARA': '84', // Auvergne-Rhône-Alpes
                'FRPAC': '93', // Provence-Alpes-Côte d'Azur
                'FROCC': '76', // Occitanie
                'FRNAQ': '75', // Nouvelle-Aquitaine
                'FRPDL': '52', // Pays de la Loire
                'FRBRE': '53', // Bretagne
                'FRCVL': '24', // Centre-Val de Loire
                'FRNOR': '28', // Normandie
                'FR20R': '94', //Corse
                'FRGUA': '1', // Guadeloupe
                'FRMAR': '2', // Martinique
                'FRGUY': '3', // Guyane
                'FRLRE': '4', // La Réunion
                'FRMAY': '6' // Mayotte
            };
    
           // Selectionne toutes les regions avec un id commencant par "FR"
const regions = document.querySelectorAll('path[id^="FR"]');

// Ajoute un evenement "click" pour chaque region
regions.forEach(region => {
    region.addEventListener('click', function(e) {
        e.preventDefault(); // Evite le comportement par defaut du clic
        
        const regionId = this.id; // Recupere l'id de la region cliquée
        const dbRegionId = regionMapping[regionId]; // Mappe l'id à celui de la base de données
        
        if (dbRegionId) {
            // Cree un formulaire pour envoyer l'id de la region en POST
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/trie_par_region';
            
            // Cree un champ caché pour l'id de la region
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'region_name';
            input.value = dbRegionId;
            
            // Ajoute le champ caché au formulaire
            form.appendChild(input);
            document.body.appendChild(form); // Ajoute le formulaire au body
            form.submit(); // Soumet le formulaire
        } else {
            console.error('ID de région non trouvé:', regionId); // Affiche une erreur si l'id est introuvable
        }
    });
});
        });

        </script>
